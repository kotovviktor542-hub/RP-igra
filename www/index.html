<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#05070c">
  <title>Horizons RP</title>
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root { --gold:#ffb300; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; margin:0; }
    body {
      background:#05070c; color:#e8ecf4;
      font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      display:flex; align-items:center; justify-content:center; text-align:center;
      padding:20px;
    }
    .box { max-width:460px; width:100%; }
    .logo { width:132px; height:132px; border-radius:28px; margin:0 auto 14px; display:block;
            box-shadow:0 0 42px rgba(255,179,0,.22); }
    h1 { font:800 26px/1 system-ui,sans-serif; letter-spacing:.14em; margin:0 0 4px; }
    h1 span { color:var(--gold); }
    .sub { color:#8b93a7; font-size:13px; margin:0 0 22px; letter-spacing:.05em; }
    #status { color:#9aa3b7; font-size:14px; min-height:22px; margin-bottom:16px; }
    .btn {
      display:block; width:100%; margin:9px 0; padding:15px 18px; border:1px solid rgba(255,255,255,.12);
      border-radius:14px; background:rgba(255,255,255,.05); color:#e8ecf4;
      font:600 16px system-ui,sans-serif; cursor:pointer;
    }
    .btn.primary { background:linear-gradient(180deg,#ffc53d,#f59e0b); color:#1a1200; border-color:#f59e0b; }
    .btn:active { transform:scale(.985); }
    .hidden { display:none !important; }
    .ver { color:#5f677a; font-size:12px; margin-top:16px; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,179,0,.3);
            border-top-color:var(--gold); border-radius:50%; animation:s .8s linear infinite; vertical-align:-2px; margin-right:7px; }
    @keyframes s { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="box">
  <img class="logo" src="img/icon-512.png" alt="Horizons RP">
  <h1>HORIZONS<span>RP</span></h1>
  <p class="sub">Открытый город · ролевая игра</p>

  <div id="status"><span class="spin"></span>Проверяю обновления…</div>

  <button id="btn-update" class="btn primary hidden">Обновить</button>
  <button id="btn-play" class="btn hidden">Играть</button>
  <p class="ver" id="ver"></p>
</div>

<script>
(function () {
  // Номер сборки подставляется в CI (tools/stamp.js). 0 = локальная разработка.
  var LOCAL_BUILD = 0;
  var REMOTE = 'https://kotovviktor542-hub.github.io/RP-igra/';

  var $ = function (id) { return document.getElementById(id); };
  var status = $('status'), bUpd = $('btn-update'), bPlay = $('btn-play'), ver = $('ver');

  // Запущено уже с веб-версии (github.io или dev-сервер) — обновлять нечего, просто играем.
  var isRemote = location.href.indexOf(REMOTE) === 0 || /github\.io$/.test(location.hostname);
  var pinned = localStorage.getItem('hz:useRemote') === '1';

  function go(url) { location.replace(url); }

  function play() { go(isRemote ? './game.html' : (pinned ? REMOTE + 'game.html' : './game.html')); }

  function fetchVersion() {
    return new Promise(function (res, rej) {
      var done = false;
      var to = setTimeout(function () { if (!done) { done = true; rej(new Error('timeout')); } }, 6000);
      fetch(REMOTE + 'version.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)); })
        .then(function (j) { if (!done) { done = true; clearTimeout(to); res(j); } })
        .catch(function (e) { if (!done) { done = true; clearTimeout(to); rej(e); } });
    });
  }

  if (isRemote) { play(); return; }

  ver.textContent = 'Установлена сборка ' + (LOCAL_BUILD || 'dev');
  bPlay.classList.remove('hidden');
  bPlay.onclick = play;

  fetchVersion().then(function (j) {
    var remoteBuild = j.build | 0;
    ver.textContent = 'Установлена: ' + (LOCAL_BUILD || 'dev') + ' · в сети: ' + remoteBuild;
    if (remoteBuild > LOCAL_BUILD || pinned) {
      status.innerHTML = remoteBuild > LOCAL_BUILD
        ? '🟡 Доступна новая версия — сборка <b>' + remoteBuild + '</b>'
        : '🟢 У тебя последняя версия';
      bUpd.textContent = remoteBuild > LOCAL_BUILD ? 'Обновить до сборки ' + remoteBuild : 'Обновить';
      bUpd.classList.remove('hidden');
      bUpd.onclick = function () {
        localStorage.setItem('hz:useRemote', '1');
        status.innerHTML = '<span class="spin"></span>Загружаю обновление…';
        go(REMOTE + 'game.html?v=' + remoteBuild);
      };
      bPlay.textContent = 'Играть на установленной версии';
      // если пользователь уже один раз обновлялся — уходим в онлайн-версию сразу
      if (pinned) setTimeout(function () { go(REMOTE + 'game.html?v=' + remoteBuild); }, 600);
    } else {
      status.textContent = '🟢 Установлена последняя версия';
      setTimeout(play, 500);
    }
  }).catch(function () {
    status.textContent = '📴 Нет сети — играем офлайн на установленной версии';
    setTimeout(play, 900);
  });
})();
</script>
</body>
</html>
