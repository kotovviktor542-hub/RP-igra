<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#05070c">
  <title>Horizons RP</title>
  <link rel="icon" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/ui.css">
  <script>window.__HZ_BUILD__ = 0;</script>
</head>
<body>

<canvas id="gl"></canvas>

<!-- ================= ЗАГРУЗКА ================= -->
<div id="loader" class="overlay">
  <div class="loader-box">
    <h1 class="brand">HORIZONS<span>RP</span></h1>
    <div class="bar-outer"><div id="load-bar" class="bar-inner"></div></div>
    <p id="load-text">Инициализация…</p>
    <p class="hint" id="load-hint"></p>
  </div>
</div>

<!-- ================= ГЛАВНОЕ МЕНЮ ================= -->
<div id="menu" class="overlay hidden">
  <div class="menu-box">
    <h1 class="brand">HORIZONS<span>RP</span></h1>
    <p class="sub">Открытый город · ролевая игра</p>
    <button id="btn-continue" class="btn primary hidden">Продолжить</button>
    <button id="btn-online" class="btn primary">Играть онлайн</button>
    <button id="btn-new" class="btn">Тренировка (оффлайн)</button>
    <button id="btn-servers" class="btn hidden">Серверы · мультиплеер</button>
    <button id="btn-settings" class="btn">Настройки</button>
    <button id="btn-update" class="btn">Проверить обновление</button>
    <p class="ver" id="menu-version">v0.3.0</p>
  </div>
</div>

<!-- ================= ОНЛАЙН: АККАУНТ И СЕРВЕРЫ ================= -->
<div id="online" class="overlay hidden">
  <div class="online-wrap">
    <div class="panel-head">
      <h3>Онлайн</h3>
      <button id="online-close" class="icon-btn">✕</button>
    </div>
    <div id="online-body" class="panel-body"></div>
  </div>
</div>

<!-- ================= СОЗДАНИЕ ПЕРСОНАЖА ================= -->
<div id="creator" class="overlay hidden">
  <div class="creator-wrap">
    <h2>Создание персонажа</h2>
    <div class="creator-grid">
      <div class="creator-preview"><canvas id="cc-canvas"></canvas></div>
      <div class="creator-form">
        <label class="field">
          <span>Имя и фамилия</span>
          <input id="cc-name" type="text" maxlength="24" placeholder="Иван Петров" autocomplete="off">
        </label>

        <div class="field">
          <span>Пол</span>
          <div class="seg" data-seg="gender">
            <button class="seg-btn active" data-v="m">Мужской</button>
            <button class="seg-btn" data-v="f">Женский</button>
          </div>
        </div>

        <div class="field"><span>Тон кожи</span><div class="swatches" id="cc-skin"></div></div>
        <div class="field"><span>Волосы</span><div class="swatches" id="cc-hair"></div></div>
        <div class="field">
          <span>Причёска</span>
          <div class="seg" data-seg="hairStyle">
            <button class="seg-btn active" data-v="0">1</button>
            <button class="seg-btn" data-v="1">2</button>
            <button class="seg-btn" data-v="2">3</button>
            <button class="seg-btn" data-v="3">4</button>
          </div>
        </div>
        <div class="field"><span>Верх</span><div class="swatches" id="cc-shirt"></div></div>
        <div class="field"><span>Низ</span><div class="swatches" id="cc-pants"></div></div>

        <label class="field">
          <span>Рост <b id="cc-h-val">178</b> см</span>
          <input id="cc-height" type="range" min="155" max="200" value="178">
        </label>
        <label class="field">
          <span>Телосложение</span>
          <input id="cc-build" type="range" min="70" max="135" value="100">
        </label>
      </div>
    </div>
    <div class="creator-actions">
      <button id="cc-random" class="btn">Случайно</button>
      <button id="cc-back" class="btn">Назад</button>
      <button id="cc-start" class="btn primary">В город</button>
    </div>
  </div>
</div>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <!-- верх слева: деньги, уровень -->
  <div class="hud-top-left">
    <div class="money-chip"><span id="hud-money">0 $</span></div>
    <div class="sub-chip">
      <span id="hud-bank">Банк 0 $</span>
      <span class="dot">·</span>
      <span id="hud-level">Ур. 1</span>
    </div>
  </div>

  <!-- верх справа: часы, FPS -->
  <div class="hud-top-right">
    <div class="clock-chip"><span id="hud-clock">09:30</span></div>
    <div class="sub-chip right"><span id="hud-fps">60 fps</span></div>
    <div class="sub-chip right wanted hidden" id="hud-wanted"></div>
    <div class="sub-chip right ammo hidden" id="hud-ammo">🔫 0</div>
  </div>

  <!-- полоски состояния -->
  <div class="hud-stats" id="hud-stats"></div>

  <!-- миникарта -->
  <div class="minimap-wrap">
    <canvas id="minimap" width="200" height="200"></canvas>
    <div class="minimap-ring"></div>
    <div id="mm-street" class="mm-street">—</div>
  </div>

  <!-- спидометр -->
  <div id="speedo" class="speedo hidden">
    <canvas id="speedo-canvas" width="190" height="190"></canvas>
    <div class="speedo-val"><span id="speed-num">0</span><small>км/ч</small></div>
    <div class="speedo-fuel">
      <div class="fuel-bar"><div id="fuel-fill"></div></div>
      <span id="fuel-txt">80 л</span>
    </div>
  </div>

  <!-- подсказка взаимодействия -->
  <div id="prompt" class="prompt hidden"></div>

  <!-- уведомления -->
  <div id="toasts" class="toasts"></div>

  <!-- трекер задания -->
  <div id="tracker" class="tracker hidden">
    <div class="tracker-title" id="tracker-title">Задание</div>
    <div class="tracker-step" id="tracker-step"></div>
    <div class="tracker-dist" id="tracker-dist"></div>
  </div>

  <!-- чат -->
  <div id="chat" class="chat">
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row hidden" id="chat-row">
      <input id="chat-input" type="text" maxlength="120" placeholder="Сообщение… (/me, /do, /pay)">
      <button id="chat-send">▶</button>
    </div>
  </div>

  <!-- сенсорное управление -->
  <div id="dmg-flash" class="dmg-flash"></div>

  <div id="crosshair" class="crosshair hidden"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="24" cy="24" r="12" opacity=".65"/><path d="M24 4v9M24 35v9M4 24h9M35 24h9"/><circle cx="24" cy="24" r="1.6" fill="#fff" stroke="none"/></svg></div>

  <div id="touch" class="touch">
    <div id="stick" class="stick"><div id="stick-knob" class="stick-knob"></div></div>
    <div class="buttons">
      <button class="rb hot foot-only" id="b-punch" aria-label="Удар" title="Удар"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.2V8.6a1.5 1.5 0 0 1 3 0v2.2"/><path d="M10 10.6V7.8a1.5 1.5 0 0 1 3 0v2.8"/><path d="M13 10.8V8.4a1.5 1.5 0 0 1 3 0v2.6"/><path d="M6.5 10.5h10a2.5 2.5 0 0 1 2.5 2.5v1.6A5.4 5.4 0 0 1 13.6 20h-3A5.1 5.1 0 0 1 5.5 15v-3a1.5 1.5 0 0 1 1-1.5z"/><path d="M5.6 12.6H4.3a1.4 1.4 0 0 1 0-2.8h1.4"/></svg></button>
      <button class="rb foot-only" id="b-aim" aria-label="Прицел" title="Прицел"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="1.8" fill="currentColor" stroke="none"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></button>
      <button class="rb foot-only" id="b-jump" aria-label="Прыжок" title="Прыжок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="m6 12 6-6 6 6"/></svg></button>
      <button class="rb" id="b-action" aria-label="Действие" title="Действие"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.6" r="1.8"/><path d="M12 7.2v6"/><path d="M12 13.2V10a1.4 1.4 0 0 1 2.8 0v3.2"/><path d="M14.8 13.4v-1.6a1.4 1.4 0 0 1 2.8 0V16a5 5 0 0 1-5 5h-1.4a4.4 4.4 0 0 1-3.2-1.4l-3-3.2a1.5 1.5 0 0 1 2.1-2.1L10 16.2V9.6a1.4 1.4 0 0 1 2.8 0"/></svg></button>
      <button class="rb" id="b-run" aria-label="Бег" title="Бег"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="4" r="2.2"/><path d="M12.6 21l1.8-5.4-3.1-2.6-1 4"/><path d="M14.4 15.6 17 21"/><path d="M8.2 9.6 12.6 7.4a2 2 0 0 1 2.2.2l2.1 1.7 2.6.6"/><path d="M11.3 13 9.6 11.4"/><path d="M3.6 12.2h3.2M2.8 16h3.6"/></svg></button>
      <button class="rb drive-only" id="b-brake" aria-label="Ручник" title="Ручник"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M9 8.5h2.6a2 2 0 0 1 0 4H9V8.5zm0 4h2.9a2 2 0 0 1 0 4H9v-4z"/></svg></button>
      <button class="rb drive-only" id="b-horn" aria-label="Сигнал" title="Сигнал"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h3.5L13 19V5L6.5 10H3z"/><path d="M16.5 9a4 4 0 0 1 0 6"/><path d="M19 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      <button class="rb drive-only" id="b-light" aria-label="Фары" title="Фары"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.5a6 6 0 0 0 0 12 6 6 0 0 0 0-12z"/><path d="M15 8.5h3M15 12h5M15 15.5h3"/><path d="M4 9v6"/></svg></button>
    </div>
  </div>

  <!-- радиальное меню (слева по центру экрана) -->
  <div id="radial" class="radial">
    <button id="radial-btn" class="radial-core" aria-label="Меню">☰</button>
    <div id="radial-items" class="radial-items"></div>
  </div>

</div>

<!-- ================= ПАНЕЛИ ================= -->
<div id="panel" class="panel hidden">
  <div class="panel-head">
    <h3 id="panel-title">Панель</h3>
    <button id="panel-close" class="icon-btn">✕</button>
  </div>
  <div id="panel-body" class="panel-body"></div>
</div>

<!-- ================= ПОЛНАЯ КАРТА ================= -->
<div id="bigmap" class="overlay hidden">
  <div class="bigmap-head">
    <h3>Карта города</h3>
    <button id="bigmap-close" class="icon-btn">✕</button>
  </div>
  <canvas id="bigmap-canvas"></canvas>
  <div class="bigmap-legend" id="bigmap-legend"></div>
</div>

<!-- ================= ДИАЛОГ ================= -->
<div id="dialog" class="overlay hidden">
  <div class="dialog-box">
    <h3 id="dialog-title">—</h3>
    <p id="dialog-text">—</p>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<div id="rotate" class="overlay hidden">
  <div class="menu-box">
    <h1 class="brand">HORIZONS<span>RP</span></h1>
    <p class="sub">Поверни телефон горизонтально 🔄</p>
  </div>
</div>

</body>
</html>
