# Render.com — деплой в один клик: New → Blueprint → этот репозиторий
services:
  - type: web
    name: horizons-rp-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: SERVER_NAME
        value: Horizons RP — официальный
      - key: MAX_PLAYERS
        value: "64"
      - key: SEED
        value: "20261007"
      - key: GOOGLE_CLIENT_ID
        sync: false
