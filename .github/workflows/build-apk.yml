name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # На ubuntu-latest Android SDK предустановлен — используем его,
          # android-actions/setup-android@v3 падает на устаревшем пакете "tools".
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Install dependencies
        run: npm install

      - name: Run logic tests
        run: npm run check

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        id: prep
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" "out/RP-igra-build${{ github.run_number }}.apk"
          ls -lh out/
          echo "apk=out/RP-igra-build${{ github.run_number }}.apk" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RP-igra-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: RP-igra v0.1.0 build ${{ github.run_number }}
          body: |
            Автосборка из коммита ${{ github.sha }}

            **Установка:** скачай APK ниже, разреши установку из неизвестных источников.

            Коммит: ${{ github.event.head_commit.message }}
          files: ${{ steps.prep.outputs.apk }}
          draft: false
          prerelease: false
