name: Build APK & Deploy Web

# APK собирается ТОЛЬКО вручную (кнопка Run workflow).
# Обычные обновления игры едут через deploy-web.yml — переустанавливать APK не нужно.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Номер сборки для APK (должен быть больше текущего в version.json)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # На ubuntu-latest Android SDK предустановлен — используем его,
          # android-actions/setup-android@v3 падает на устаревшем пакете "tools".
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- installed platforms ---"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Install dependencies
        run: npm install

      - name: Run logic tests
        run: npm run check

      - name: Stamp build number
        run: BUILD_NUMBER=${{ github.event.inputs.build_number != '0' && github.event.inputs.build_number || format('{0}', github.run_number) }} node tools/stamp.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Patch Android (иконки Horizons RP + ландшафт)
        run: node tools/patch-android.js

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK (постоянный ключ, стабильный SHA-1)
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "unsigned: $RAW"
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk
          "$BT/apksigner" sign \
            --ks android-keys/release.keystore \
            --ks-pass pass:rpigra2026 --key-pass pass:rpigra2026 --ks-key-alias rpigra \
            --out signed.apk aligned.apk
          "$BT/apksigner" verify --print-certs signed.apk | grep -i "SHA-1" || true

      - name: Prepare artifact
        id: prep
        run: |
          APK=signed.apk
          echo "Found APK: $APK"
          mkdir -p out
          cp "$APK" "out/HorizonsRP-build${{ github.run_number }}.apk"
          ls -lh out/
          echo "apk=out/HorizonsRP-build${{ github.run_number }}.apk" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorizonsRP-apk-build${{ github.run_number }}
          path: ${{ steps.prep.outputs.apk }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build${{ github.run_number }}
          name: Horizons RP · сборка ${{ github.run_number }}
          body: |
            **Horizons RP** · сборка ${{ github.run_number }}

            🌐 Играть сразу в браузере (ничего не качать): https://kotovviktor542-hub.github.io/RP-igra/
            📱 APK ниже — ставится один раз, дальше игра обновляется сама кнопкой «Обновить».

            Ручная сборка APK из ветки main. Подпись — постоянный релизный ключ
            (SHA-1 `1C:0A:C6:72:85:AF:9E:5C:28:81:F1:67:AE:26:3E:96:09:EE:74:C2`),
            поэтому обновление ставится поверх прошлой версии.
          files: ${{ steps.prep.outputs.apk }}
          draft: false
          prerelease: false
